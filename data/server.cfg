sv_hostname "BotRP | Development Server"

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_maxclients 8

sets gamename "gta5"
sets tags "BotRP, Roleplay, Development"
sets locale "en-US"

set onesync on
sv_scriptHookAllowed 0

# Private local configuration
exec server.local.cfg

# Vanilla foundation
ensure chat

# BotRP compatibility layer
ensure botrp_bridge

# BotRP core/session services
ensure botrp_core

# Independent BotRP resources
ensure botrp_characters
