## You CAN edit the following:
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
sv_maxclients 48
set steam_webApiKey "none"
sets tags "default, deployer, qbox, botrp"

## You MAY edit the following:

sv_hostname "BotRP built with Qbox Project by The Community!"
sets sv_projectName "[Qbox Project] BotRP"
sets sv_projectDesc "BotRP roleplay server"
sets locale "root-AQ" # replace with your language and location code, like en-US, pt-BR, etc
load_server_icon myLogo.png
exec secrets.cfg

# Chat config
set resources_useSystemChat true
set qbx_chat:joinMessage "^2%s joined the server"
set qbx_chat:quitMessage "^1%s left the server (%s)"

# Voice config
exec voice.cfg

# Qbox config
setr qb_locale "en"
setr qbx:enableBridge "true"
set qbx:enableQueue "true"
set qbx:bucketLockdownMode "inactive"
set qbx:discordLink "discord.gg/qbox"
set qbx:max_jobs_per_player 1
set qbx:max_gangs_per_player 1
set qbx:setjob_replaces "true"
set qbx:setgang_replaces "true"
set qbx:cleanPlayerGroups "true"
set qbx:allowMethodOverrides "true"
set qbx:disableOverrideWarning "false"
setr qbx:enableVehiclePersistence "false"
setr qbx:vehiclePersistenceType "semi"
set qbx:acknowledge "false"
setr qbx:enableGroupManagement "false"

# Message displayed to players in the chat after loading in
setr qbx:motd "<p style='padding: 1rem; background-color: #141517; border: 1px solid #373a40; border-radius: 0.5rem; text-align: center;'><span style='color: rgb(200, 200, 40);'>Welcome to BotRP!</span><br>BotRP roleplay server</p>"

setr illenium-appearance:locale "en"
setr weather_disablecd true
exec ox.cfg

# NPWD config
set npwd:framework "qbx"
set SCREENSHOT_BASIC_TOKEN ""
set NPWD_AUDIO_TOKEN ""

setr loadscreen:externalShutdown true
set loadscreen:primaryColor "#f1e542"
set loadscreen:shadowColor "#1a18077f"

# Core resources
ensure mapmanager
ensure chat
ensure spawnmanager
stop basic-gamemode
ensure baseevents

# Qbox & Extra stuff
ensure ox_lib
ensure qbx_core
ensure ox_target
ensure [ox]
ensure [qbx]
ensure [standalone]
ensure [voice]

# BotRP foundation
ensure botrp_core
ensure botrp_identity
ensure botrp_audit
ensure botrp_playerstate

# NPWD core only. Optional NPWD app pack is intentionally not loaded.
ensure qbx_npwd
ensure npwd

## Permissions ##
add_principal identifier.fivem:8084825 group.admin #NotAGirl
exec permissions.cfg

## Miscellaneous ##
exec misc.cfg
