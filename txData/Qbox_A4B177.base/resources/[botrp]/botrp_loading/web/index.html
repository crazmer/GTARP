<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BotRP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Native FiveM loadscreen must be visible immediately. The previous
       `hidden` class made the page render as a completely black screen
       because loadProgress does not send our custom `show` action. -->
  <main id="app">
    <div class="glow"></div>
    <section class="card">
      <div class="brand">BOT<span>RP</span></div>
      <div class="line"></div>
      <h1 id="title">Welcome to BotRP</h1>
      <p id="subtitle">Preparing your character...</p>
      <div class="loader"><div class="bar"></div></div>
      <div class="status"><span class="dot"></span><span id="status">CONNECTING TO SERVER</span></div>
    </section>
    <footer>ROLEPLAY • COMMUNITY • IMMERSION</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
